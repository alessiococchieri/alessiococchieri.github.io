        summary: "Natural Language Processing — LLM Factuality"
        highlights:
          - Created a novel benchmark for multimodal scientific fact-checking, targeting LLM long-form generation
          - Coordinated a multi-team human annotation pipeline, overseeing annotation guidelines, quality control, and IAA
          - Conducted systematic analysis exposing critical factuality fragilities in multimodal LLMs across scientific domains

      - company: IBM Research
        position: Research Scientist Internship (Master Thesis)
        location: Dublin, Ireland
        start_date: 2023-03
        end_date: 2023-05
        summary: "Natural Language Processing — Named Entity Recognition"
        highlights:
          - Leveraged LLM distillation to improve smaller-sized models for zero-shot NER
          - Produced two peer-reviewed publications — OpenBioNER (NAACL 2025) and ZeroNER (ACL 2025)
          - Contributed to the IBM zshot library for zero-shot NER model inference

    Publications:
      - title: "LLMs (Almost) Never Abstain Under Medical Uncertainty"
        authors:
          - Alessio Cocchieri
          - et al.
        publisher: ACL 2026 (Main)
        releaseDate: 2026
        summary: "We introduce MedQAbstain, a benchmark for medical abstention under uncertainty, revealing that state-of-the-art LLMs systematically overcommit, rarely abstaining even when the question itself is hidden."

      - title: "ReMedQA: Are We Done With Medical Multiple-Choice Benchmarks?"
        authors:
          - Alessio Cocchieri
          - et al.
        publisher: EACL 2026 (Main)
        releaseDate: 2026
        summary: "We show that high LLM accuracy in medical MCQA masks severe inconsistency. We propose novel metrics to evaluate true reliability across MCQA formats."

      - title: "What do you call a dog that is incontrovertibly true? Dogma: Testing LLM Generalization through Humor"
        authors:
          - Alessio Cocchieri
          - et al.
        publisher: ACL 2025 (Main)
        releaseDate: 2025
        summary: "We introduce Phunny, a novel benchmark using uncontaminated English puns, revealing that LLMs struggle with generalization even on simple tasks, consistently underperforming the human baseline."

      - title: "Can Large Language Models Win the International Mathematical Games?"
        authors:
          - Alessio Cocchieri
          - et al.
        publisher: EMNLP 2025 (Main)
        releaseDate: 2025
        summary: "We introduce MathGames, a novel multimodal benchmark of age-graded math problems from an international competition, showing that frontier LLMs underperform compared to humans, including 11-year-olds."

      - title: "OpenBioNER: Lightweight Open-Domain Biomedical NER Through Entity Type Description"
        authors:
          - Alessio Cocchieri
          - et al.
        publisher: NAACL 2025 (Findings)
        releaseDate: 2025
        summary: "We introduce a 110M BERT model that leverages descriptions for zero-shot Biomedical NER, outperforming GPT-4o, specialized LLMs, and GLiNER by up to 10% F1."

      - title: "To Generate or to Retrieve? On the Effectiveness of Artificial Contexts for Medical Open-Domain Question Answering"
        authors:
          - Giacomo Frisoni
          - Alessio Cocchieri
          - et al.
        publisher: ACL 2024 (Main)
        releaseDate: 2024
        summary: "We introduce MedGENIE, the first generate-then-read framework for open-domain medical QA, demonstrating the effectiveness of generated over retrieved contexts and significantly improving LLM RAG performance."

